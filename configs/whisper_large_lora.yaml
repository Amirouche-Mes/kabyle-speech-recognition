model:
  name: openai/whisper-large-v3
  language: kabyle
  task: transcribe

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.1
  target_modules:
    - q_proj
    - v_proj
    - k_proj
    - o_proj

training:
  output_dir: checkpoints/whisper-large-lora-kab
  batch_size: 8
  gradient_accumulation_steps: 4
  learning_rate: 1e-4
  epochs: 5
  warmup_steps: 250
  eval_strategy: steps
  eval_steps: 500
  save_steps: 500
  logging_steps: 50
  fp16: true
  save_total_limit: 3
  report_to: wandb

data:
  data_dir: data/raw/cv-corpus-25.0-2026-03-09/kab
  sampling_rate: 16000
  num_workers: 4
